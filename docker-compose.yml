services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      ALQUIMIA_CLAVE: ${ALQUIMIA_CLAVE:-}
      ALQUIMIA_ADMIN: ${ALQUIMIA_ADMIN:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      ALQUIMIA_URL: ${ALQUIMIA_URL:-}
    volumes:
      - datos:/data
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  datos:
